<style>

/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#fffaf0;
    --surface:#fffef8;
    --soft:#f6eed8;
    --text:#1d1a14;
    --body:#3d3830;
    --yellow:#f2c94c;
    --green:#e8ddb4;
    --gold:#a87c00;
    --blue:#1687ff;
    --black:#17150f;
    --white:#ffffff;
    --border:2px solid var(--black);
    --shadow:6px 7px 0 var(--black);
    --soft-shadow:3px 4px 0 var(--black);
    --radius:12px;

    --ease-out:cubic-bezier(.22,.75,.2,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}


body{
    background:var(--bg);
    color:var(--body);
    font-family:"Nunito Sans",sans-serif;
    line-height:1.7;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
}


body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;
    background:
        radial-gradient(circle at 8% 8%, rgba(242,201,76,.30), transparent 25%),
        radial-gradient(circle at 90% 20%, rgba(232,221,180,.40), transparent 25%),
        radial-gradient(circle at 50% 90%, rgba(242,201,76,.18), transparent 30%);
}


body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
    opacity:.25;
    background-image:
        linear-gradient(rgba(29,26,20,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29,26,20,.07) 1px, transparent 1px);
    background-size:48px 48px;
    animation:gridMove 18s linear infinite;
}


@keyframes gridMove{
    from{ background-position:0 0; }
    to{ background-position:48px 48px; }
}


a{
    color:inherit;
    text-decoration:none;
}


img{
    max-width:100%;
    display:block;
}


.container{
    width:min(1180px, calc(100% - 32px));
    margin:auto;
}


/* =========================================================
   ANIMATION KEYFRAMES
========================================================= */

@keyframes pageReveal{
    from{
        opacity:0;
        transform:translateY(18px);
        filter:blur(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}


@keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(28px); }
    to{ opacity:1; transform:translateY(0); }
}


@keyframes fadeSlideLeft{
    from{ opacity:0; transform:translateX(-28px); }
    to{ opacity:1; transform:translateX(0); }
}


@keyframes fadeSlideRight{
    from{ opacity:0; transform:translateX(28px); }
    to{ opacity:1; transform:translateX(0); }
}


@keyframes fadeScaleIn{
    from{
        opacity:0;
        transform:scale(.9) rotate(4deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(1deg);
    }
}


@keyframes softPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:3px 4px 0 var(--black);
    }
    50%{
        transform:scale(1.04);
        box-shadow:5px 6px 0 var(--black);
    }
}


@keyframes dotPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.4); }
}


@keyframes spinRotate{
    to{ transform:rotate(360deg); }
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav{
    position:sticky;
    top:14px;
    z-index:100;

    width:min(1180px, calc(100% - 24px));
    margin:14px auto 0;
    padding:10px;

    background:rgba(255,254,248,.90);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border:var(--border);
    border-radius:999px;
    box-shadow:var(--soft-shadow);

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    animation:fadeSlideUp .8s var(--ease-out) both;
    transition:box-shadow .4s var(--ease-out);
}


.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
}


.brand-logo{
    width:45px;
    height:45px;
    object-fit:contain;
    border:var(--border);
    border-radius:50%;
    background:var(--yellow);
    padding:5px;

    transition:transform .5s var(--ease-spring);
}


.brand:hover .brand-logo{
    transform:rotate(-8deg) scale(1.08);
}


.brand span{
    font-family:"Archivo Black",sans-serif;
}


.nav-links{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:7px;
    flex-wrap:wrap;
}


.nav-links a{
    padding:9px 14px;
    border:2px solid transparent;
    border-radius:999px;
    font-size:14px;
    font-weight:800;

    transition:background .3s var(--ease-out), border-color .3s var(--ease-out), transform .3s var(--ease-out);
}


.nav-links a:hover{
    background:var(--yellow);
    border-color:var(--black);
    transform:translateY(-2px);
}


/* =========================================================
   HERO
========================================================= */

.hero{
    padding:95px 0 80px;
}


.hero-grid{
    display:grid;
    grid-template-columns:1.08fr .92fr;
    gap:55px;
    align-items:center;
}


.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:8px 15px;

    background:var(--green);
    border:var(--border);
    border-radius:999px;

    font-family:"Roboto Mono",monospace;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;

    box-shadow:var(--soft-shadow);

    opacity:0;
    animation:fadeSlideLeft .8s var(--ease-out) .2s forwards;
}


.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#2b8a3e;
    border:2px solid var(--black);
    animation:dotPulse 2s ease-in-out infinite;
}


h1{
    margin:25px 0 20px;
    color:var(--text);
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(50px,7vw,88px);
    line-height:.98;
    letter-spacing:-3px;
}


h1 .reveal-line{
    display:block;
    opacity:0;
    animation:fadeSlideUp .9s var(--ease-out) forwards;
}


h1 .reveal-line:nth-child(1){ animation-delay:.35s; }
h1 .reveal-line:nth-child(2){ animation-delay:.5s; }


h1 .highlight{
    position:relative;
    display:inline-block;
    z-index:1;
}


h1 .highlight::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:2px;
    height:14px;
    background:var(--yellow);
    z-index:-1;
    transform:rotate(-1deg) scaleX(0);
    transform-origin:left center;
    animation:underlineGrow .9s var(--ease-spring) .95s forwards;
}


@keyframes underlineGrow{
    to{ transform:rotate(-1deg) scaleX(1); }
}


.hero-description{
    max-width:760px;
    font-size:19px;
    font-weight:600;

    opacity:0;
    animation:fadeSlideUp .9s var(--ease-out) .7s forwards;
}


.hero-description strong{
    color:var(--text);
    font-weight:900;
}


.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-top:28px;

    opacity:0;
    animation:fadeSlideUp .9s var(--ease-out) 1s forwards;
}


.btn{
    display:inline-block;
    padding:13px 20px;
    border:var(--border);
    border-radius:8px;
    font-weight:900;
    box-shadow:var(--soft-shadow);

    transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
}


.btn:hover{
    transform:translate(3px,3px);
    box-shadow:none;
}


.btn:active{
    transform:translate(1px,1px);
}


.btn-primary{
    background:var(--yellow);
}


.btn-dark{
    background:var(--black);
    color:white;
}


/* =========================================================
   PROFILE IMAGE FRAME
========================================================= */

.profile-frame{
    position:relative;
    padding:20px;
    background:var(--yellow);
    border:var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    transform:rotate(1deg);

    opacity:0;
    animation:fadeScaleIn 1.1s var(--ease-spring) .15s forwards;

    transition:transform .7s var(--ease-spring), box-shadow .7s var(--ease-out);
}


.profile-frame:hover{
    transform:rotate(0deg) scale(1.02);
    box-shadow:10px 12px 0 var(--black);
}


.profile-frame::before{
    content:"EIAFSDO / PROFILE";
    position:absolute;
    top:15px;
    left:15px;
    z-index:3;

    padding:6px 10px;

    color:white;
    background:var(--black);
    border:2px solid var(--black);

    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:700;

    opacity:0;
    animation:fadeSlideRight .7s var(--ease-out) .9s forwards;
}


.profile-frame img{
    width:100%;
    aspect-ratio:1 / 1;
    object-fit:cover;
    background:var(--surface);
    border:var(--border);
    border-radius:10px;

    animation:pageReveal 1.3s var(--ease-out) .35s both;
}


.profile-initials-fallback{
    width:100%;
    aspect-ratio:1 / 1;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#fff0a4,#d1a235,#8a6500);
    color:#17150f;

    border:var(--border);
    border-radius:10px;

    font-family:"Archivo Black",sans-serif;
    font-size:140px;
    letter-spacing:-6px;
    line-height:1;
}


.profile-caption{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:15px;

    opacity:0;
    animation:fadeSlideUp .8s var(--ease-out) 1s forwards;
}


.profile-caption strong{
    color:var(--text);
    font-family:"Archivo Black",sans-serif;
    word-break:break-word;
}


.verified{
    padding:4px 9px;
    color:white;
    background:var(--blue);
    border:2px solid var(--black);
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
}


/* =========================================================
   SECTIONS
========================================================= */

section{
    padding:70px 0;
}


.section-label{
    display:inline-block;
    margin-bottom:20px;
    padding:7px 12px;

    background:var(--yellow);
    border:var(--border);
    border-radius:999px;

    box-shadow:var(--soft-shadow);

    font-family:"Roboto Mono",monospace;
    font-size:12px;
    font-weight:700;
}


.section-title{
    margin-bottom:20px;
    color:var(--text);
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(34px,5vw,60px);
    line-height:1.05;
}


.section-intro{
    max-width:850px;
    font-size:18px;
    font-weight:600;
}


/* =========================================================
   SCROLL REVEAL
========================================================= */

.reveal{
    opacity:0;
    transform:translateY(36px);
    filter:blur(4px);
    transition:
        opacity .9s var(--ease-out),
        transform .9s var(--ease-out),
        filter .9s var(--ease-out);
    will-change:opacity,transform;
}


.reveal.is-visible{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
}


/* =========================================================
   PROFILE CARD
========================================================= */

.about-card{
    margin-top:35px;
    padding:40px;

    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);

    transition:box-shadow .5s var(--ease-out);
}


.about-card:hover{
    box-shadow:8px 9px 0 var(--black);
}


.about-card p{
    margin-bottom:18px;
    font-size:17px;
}


.about-card p:last-child{
    margin-bottom:0;
}


.mark{
    padding:2px 7px;
    background:var(--yellow);
    border:2px solid var(--black);
    font-weight:900;
}


/* =========================================================
   ROLE GRID
========================================================= */

.role-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:35px;
}


.role-card{
    padding:28px;
    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);

    transition:transform .4s var(--ease-out), box-shadow .4s var(--ease-out);
}


.role-card:hover{
    transform:translateY(-6px);
    box-shadow:8px 9px 0 var(--black);
}


.role-icon{
    width:55px;
    height:55px;
    display:grid;
    place-items:center;
    margin-bottom:17px;

    background:var(--yellow);
    border:var(--border);
    border-radius:50%;

    color:var(--text);
    font-family:"Archivo Black",sans-serif;

    transition:transform .5s var(--ease-spring);
}


.role-card:hover .role-icon{
    transform:rotate(-8deg) scale(1.1);
}


.role-badge{
    display:inline-block;
    margin-bottom:12px;
    padding:5px 9px;

    background:var(--green);
    border:2px solid var(--black);
    border-radius:999px;

    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:700;
}


.role-card h3{
    margin-bottom:10px;
    color:var(--text);
    font-family:"Archivo Black",sans-serif;
    font-size:23px;
}


/* =========================================================
   ORGANIZATION
========================================================= */

.org-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    margin-top:35px;
}


.org-card{
    padding:35px;
    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);

    transition:transform .4s var(--ease-out), box-shadow .4s var(--ease-out);
}


.org-card:hover{
    transform:translateY(-6px);
    box-shadow:8px 9px 0 var(--black);
}


.org-card.codebihin{
    background:var(--black);
    color:white;
}


.org-card h3{
    margin-bottom:13px;
    color:var(--text);
    font-family:"Archivo Black",sans-serif;
    font-size:30px;
    line-height:1.15;
}


.org-card.codebihin h3{
    color:var(--yellow);
}


.org-tag{
    display:inline-block;
    margin-bottom:17px;
    padding:6px 10px;
    background:var(--yellow);
    color:var(--text);
    border:2px solid var(--black);
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:11px;
    font-weight:700;
}


.org-card p{
    margin-bottom:15px;
    font-size:16px;
}


.org-link{
    display:inline-block;
    margin-top:10px;
    padding:9px 13px;
    background:var(--yellow);
    color:var(--black);
    border:2px solid var(--black);
    border-radius:7px;
    font-weight:900;

    transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
}


.org-link:hover{
    transform:translate(-2px,-2px);
    box-shadow:4px 4px 0 var(--black);
}


/* =========================================================
   RESPONSIBILITIES
========================================================= */

.responsibility-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:35px;
}


.responsibility{
    padding:28px;
    background:var(--surface);
    border:var(--border);
    border-left:7px solid var(--yellow);
    border-radius:var(--radius);
    box-shadow:var(--soft-shadow);

    transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
}


.responsibility:hover{
    transform:translate(-2px,-3px);
    box-shadow:6px 8px 0 var(--black);
}


.responsibility h3{
    margin-bottom:10px;
    color:var(--text);
    font-family:"Archivo Black",sans-serif;
    font-size:24px;
}


/* =========================================================
   TECH STACK
========================================================= */

.tech-list{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}


.tech-pill{
    padding:10px 14px;

    background:var(--surface);
    border:var(--border);
    border-radius:999px;

    box-shadow:var(--soft-shadow);

    color:var(--text);
    font-family:"Roboto Mono",monospace;
    font-size:12px;
    font-weight:700;

    transition:transform .3s var(--ease-spring), background .3s ease;
}


.tech-pill:hover{
    transform:translateY(-4px) scale(1.05);
    background:var(--yellow);
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{
    position:relative;
    margin-top:40px;
    padding-left:45px;
}


.timeline::before{
    content:"";
    position:absolute;
    left:13px;
    top:0;
    bottom:0;
    width:4px;
    background:var(--black);
}


.timeline-item{
    position:relative;
    margin-bottom:30px;
    padding:25px;

    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--soft-shadow);

    transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
}


.timeline-item:hover{
    transform:translateX(4px);
    box-shadow:6px 7px 0 var(--black);
}


.timeline-item::before{

function escapeHTML(str){
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({
        '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
    }[tag] || tag));
}


function getInitials(name){
    if (!name) return 'U';
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return 'U';
    if (parts.length === 1) return parts[0].substring(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}


function toDate(value){
    try{
        if (!value) return null;
        if (typeof value.toDate === 'function') return value.toDate();
        if (value instanceof Date) return value;
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? null : d;
    } catch(_) { return null; }
}


function formatLongDate(value){
    const d = toDate(value);
    if (!d) return null;
    return d.toLocaleDateString('en-IN', {
        day:'2-digit', month:'long', year:'numeric'
    }).toUpperCase();
}


/* =====================================================

===================================================== */

function initRevealObserver(){
    if (revealObserver) revealObserver.disconnect();

    revealObserver = new IntersectionObserver(
        entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting){
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        },
        {
            threshold:.12,
            rootMargin:'0px 0px -40px 0px'
        }
    );
}


function attachReveal(){
    const items = document.querySelectorAll(
        ".about-card, .role-card, .org-card, .responsibility, .tech-pill, .timeline-item, .contact-card, .message, details, .cta, .section-label, .section-title, .section-intro"
    );

    items.forEach((el, i) => {
        el.classList.add('reveal');
        el.style.transitionDelay = (Math.min(i, 8) * 60) + 'ms';
        revealObserver.observe(el);
    });
}

/* =====================================================
   FETCH / SUBSCRIBE
===================================================== */

function pickPriyabrata(users){
    // Primary match: exact name match (case-insensitive)
    let found = users.find(u =>
        String(u.name || '').trim().toLowerCase() === 'priyabrata patra'
    );

    if (found) return found;

    // Secondary match: any user whose name contains "priyabrata"
    found = users.find(u =>
        String(u.name || '').toLowerCase().includes('priyabrata')
    );

    if (found) return found;

    // Tertiary: match by known email
    found = users.find(u =>
        String(u.email || '').trim().toLowerCase() === 'priyabrata@codebihin.in'
    );

    return found || null;
}


async function fetchPriyabrataOnce(){
    try{
        const snap = await db.collection('users').get();
        const users = [];
        snap.forEach(doc => users.push({ id: doc.id, ...doc.data() }));

        priyabrata = pickPriyabrata(users);

        renderPage(priyabrata || { name: 'Priyabrata Patra' });
    } catch(err){
        console.error('Priyabrata fetch error:', err);
        renderPage({ name: 'Priyabrata Patra' });
    }
}


function subscribePriyabrata(){
    if (priyabrataUnsubscribe) priyabrataUnsubscribe();

    priyabrataUnsubscribe = db.collection('users').onSnapshot(
        snap => {
            const users = [];
            snap.forEach(doc => users.push({ id: doc.id, ...doc.data() }));

            const prevId = priyabrata ? priyabrata.id : null;
            priyabrata = pickPriyabrata(users);
            const newId = priyabrata ? priyabrata.id : null;

            // Only re-render when identity changes or first render
            if (firstRender || prevId !== newId || !hasRendered){
                firstRender = false;
                hasRendered = true;
                renderPage(priyabrata || { name: 'Priyabrata Patra' });
            }
        },
        err => {
            console.error('Priyabrata subscription error:', err);
            fetchPriyabrataOnce();
        }
    );
}

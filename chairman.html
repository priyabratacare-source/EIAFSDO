<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EIAFSDO — Chairman's Desk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDKs (v10 Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
    --bg:#fffaf0;
    --surface:#fffef8;
    --soft:#f6eed8;

    --text:#1d1a14;
    --body:#3d3830;

    --yellow:#f2c94c;

    --gold:#c9972e;
    --gold-light:#ffe68a;
    --gold-dark:#765300;

    --green:#e8ddb4;

    --blue:#1687ff;

    --black:#17150f;

    --white:#fffef8;

    --border:2px solid var(--black);

    --shadow:6px 7px 0 var(--black);

    --shadow-soft:3px 4px 0 var(--black);

    --radius:12px;

    --ease-out:cubic-bezier(.22,.75,.2,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
}


/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}


body{
    font-family:"Nunito Sans",sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    z-index:-5;
    pointer-events:none;

    background:
        radial-gradient(circle at 10% 10%, rgba(242,201,76,.24), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(232,221,180,.38), transparent 27%),
        radial-gradient(circle at 50% 100%, rgba(242,201,76,.15), transparent 32%);

    filter:blur(22px);
    animation:bgBreath 9s ease-in-out infinite alternate;
}


body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;
    opacity:.22;

    background-image:
        linear-gradient(rgba(29,26,20,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29,26,20,.08) 1px, transparent 1px);

    background-size:48px 48px;
    animation:gridMove 20s linear infinite;
}


@keyframes bgBreath{
    from{ transform:scale(1); }
    to{ transform:scale(1.08); }
}


@keyframes gridMove{
    from{ background-position:0 0; }
    to{ background-position:48px 48px; }
}


/* =====================================================
   SMOOTH PAGE ENTRANCE
===================================================== */

@keyframes pageReveal{
    from{
        opacity:0;
        transform:translateY(20px);
        filter:blur(6px);
    }
    to{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}


@keyframes fadeSlideUp{
    from{
        opacity:0;
        transform:translateY(28px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


@keyframes fadeSlideRight{
    from{
        opacity:0;
        transform:translateX(-30px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}


@keyframes fadeSlideLeft{
    from{
        opacity:0;
        transform:translateX(30px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}


@keyframes fadeScaleIn{
    from{
        opacity:0;
        transform:scale(.9) rotate(-6deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(-2deg);
    }
}


@keyframes letterDrop{
    0%{
        opacity:0;
        transform:translateY(-24px) rotate(-6deg);
        filter:blur(10px);
    }
    60%{
        opacity:1;
        filter:blur(0);
    }
    100%{
        opacity:1;
        transform:translateY(0) rotate(0);
        filter:blur(0);
    }
}


@keyframes softPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:3px 4px 0 var(--black);
    }
    50%{
        transform:scale(1.04);
        box-shadow:5px 6px 0 var(--black);
    }
}


@keyframes floatDot{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-13px); }
}


@keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.35); }
}


@keyframes spinRotate{
    to{ transform:rotate(360deg); }
}


@keyframes shimmerLoad{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav{
    position:sticky;
    top:12px;
    z-index:1000;

    width:min(1180px, calc(100% - 28px));
    margin:12px auto 0;
    min-height:66px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    padding:9px 13px;

    background:rgba(255,254,248,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:var(--border);
    border-radius:999px;

    box-shadow:var(--shadow-soft);

    animation:fadeSlideUp .8s var(--ease-out) both;
    transition:box-shadow .4s var(--ease-out);
}


.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text);
    text-decoration:none;
}


.brand-logo{
    width:44px;
    height:44px;
    border-radius:50%;
    border:2px solid var(--black);
    object-fit:cover;
    background:var(--yellow);
    transition:transform .4s var(--ease-spring);
}


.brand:hover .brand-logo{
    transform:rotate(-8deg) scale(1.06);
}


.brand-text{
    font-family:"Archivo Black",sans-serif;
    font-size:15px;
}


.nav-links{
    display:flex;
    align-items:center;
    gap:6px;
}


.nav-links a{
    color:var(--text);
    text-decoration:none;
    padding:9px 12px;
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
    transition:background .3s var(--ease-out), transform .3s var(--ease-out);
}


.nav-links a:hover{
    background:var(--yellow);
    transform:translateY(-2px);
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:min(1120px, calc(100% - 30px));
    margin:auto;
}


.section{
    padding:95px 0 15px;
}


.label{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:7px 12px;

    background:var(--yellow);
    border:var(--border);
    border-radius:999px;

    box-shadow:var(--shadow-soft);

    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
}


.label::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--black);
    animation:pulse 2.4s ease-in-out infinite;
}


.section-title{
    margin-top:21px;
    max-width:900px;
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(38px,6vw,72px);
    line-height:.98;
    letter-spacing:-2px;
}


.section-description{
    max-width:790px;
    margin-top:18px;
    color:var(--body);
    font-size:17px;
    line-height:1.75;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:680px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:110px 0 70px;
}


.hero-inner{
    width:100%;
    display:grid;
    grid-template-columns:.95fr 1.05fr;
    gap:60px;
    align-items:center;
}


/* =====================================================
   CHAIRMAN VISUAL — CINEMATIC ENTRANCE
===================================================== */

.chairman-visual{
    position:relative;
    display:flex;
    justify-content:center;

    animation:fadeScaleIn 1.2s var(--ease-spring) both;
    animation-delay:.15s;
}


.chairman-frame{
    position:relative;
    width:min(420px, 100%);
    aspect-ratio:1/1;

    background:linear-gradient(135deg, #fff0a0, #f2c94c);

    border:var(--border);
    border-radius:22px;

    box-shadow:10px 12px 0 var(--black);

    padding:15px;

    transform:rotate(-2deg);

    transition:transform .8s var(--ease-spring), box-shadow .8s var(--ease-spring);
}


.chairman-frame:hover{
    transform:rotate(0deg) scale(1.02);
    box-shadow:14px 16px 0 var(--black);
}


.chairman-frame::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-40px;
    top:-40px;
    border-radius:50%;
    background:var(--yellow);
    border:var(--border);
    z-index:-1;

    animation:softPulse 4s ease-in-out infinite;
}


.chairman-frame::after{
    content:"CHAIRMAN";
    position:absolute;
    left:-35px;
    bottom:35px;

    padding:10px 14px;

    background:var(--black);
    color:var(--yellow);

    border:2px solid var(--yellow);
    border-radius:999px;

    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;

    transform:rotate(-5deg);

    animation:letterDrop .9s var(--ease-spring) both;
    animation-delay:1s;
}


.chairman-photo{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;

    border:2px solid var(--black);
    border-radius:13px;

    background:var(--soft);

    animation:pageReveal 1.4s var(--ease-out) both;
    animation-delay:.4s;
}


.chairman-initials-fallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg, #fff0a4, #d1a235, #8a6500);
    color:#17150f;

    border:2px solid var(--black);
    border-radius:13px;

    font-family:"Archivo Black",sans-serif;
    font-size:120px;
    letter-spacing:-4px;
    line-height:1;
}


.image-orbit{
    position:absolute;
    width:25px;
    height:25px;
    border-radius:50%;
    background:var(--blue);
    border:2px solid var(--black);
    top:35px;
    left:20px;
    animation:floatDot 3s ease-in-out infinite;
    opacity:0;
    animation:fadeSlideUp .6s var(--ease-out) .9s forwards,
              floatDot 3s ease-in-out 1.5s infinite;
}


.image-orbit.two{
    width:17px;
    height:17px;
    background:#35a853;
    top:auto;
    left:auto;
    right:30px;
    bottom:30px;
    animation:fadeSlideUp .6s var(--ease-out) 1.1s forwards,
              floatDot 3s ease-in-out 1.7s infinite;
}


/* =====================================================
   HERO CONTENT — LETTER-BY-LETTER REVEAL
===================================================== */

.hero-content{
    text-align:left;
}


.status{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:8px 14px;

    background:var(--green);
    border:var(--border);
    border-radius:999px;

    box-shadow:var(--shadow-soft);

    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;

    opacity:0;
    animation:fadeSlideRight .8s var(--ease-out) .3s forwards;
}


.status.state-active{
    background:#fffbe9;
    border-color:#b88600;
}


.status.state-board{
    background:#e6eeff;
    border-color:#3d64b8;
}


.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#35a853;
    border:1px solid var(--black);
    animation:pulse 1.6s ease-in-out infinite;
}


.status.state-board .status-dot{
    background:#3d64b8;
}


.hero h1{
    margin-top:25px;
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(48px,7vw,92px);
    line-height:.9;
    letter-spacing:-4px;
}


.hero h1 span{
    display:block;
    position:relative;
    width:max-content;
}


.hero h1 span::after{
    content:"";
    position:absolute;
    left:2%;
    right:-4%;
    bottom:2px;
    height:14px;
    background:var(--yellow);
    z-index:-1;
    transform:skew(-8deg) scaleX(0);
    transform-origin:left center;
    animation:underlineGrow 1s var(--ease-spring) .9s forwards;
}


@keyframes underlineGrow{
    to{ transform:skew(-8deg) scaleX(1); }
}


.hero-sub{
    max-width:650px;
    margin-top:25px;
    color:var(--body);
    font-size:17px;
    line-height:1.75;

    opacity:0;
    animation:fadeSlideUp .9s var(--ease-out) .7s forwards;
}


.role-pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:24px;
}


.role-pill{
    padding:8px 11px;
    background:var(--surface);
    border:2px solid var(--black);
    border-radius:999px;
    box-shadow:2px 3px 0 var(--black);
    font-family:"Roboto Mono",monospace;
    font-size:9px;
    font-weight:900;

    opacity:0;
    animation:fadeSlideUp .7s var(--ease-out) .9s forwards;
}


.role-pill:nth-child(2){ animation-delay:1s; }
.role-pill:nth-child(3){ animation-delay:1.1s; }
.role-pill:nth-child(4){ animation-delay:1.2s; }


.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:28px;

    opacity:0;
    animation:fadeSlideUp .9s var(--ease-out) 1.2s forwards;
}


.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:48px;
    padding:12px 19px;

    border:var(--border);
    border-radius:9px;

    box-shadow:var(--shadow-soft);
    text-decoration:none;
    color:var(--text);

    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;

    transition:transform .35s var(--ease-spring),
               box-shadow .35s var(--ease-out),
               background .3s ease;
    cursor:pointer;
}


.btn:hover{
    transform:translate(-2px,-2px);
    box-shadow:6px 7px 0 var(--black);
}


.btn:active{
    transform:translate(1px,2px);
    box-shadow:1px 1px 0 var(--black);
}


.btn-yellow{ background:var(--yellow); }
.btn-white{ background:var(--surface); }


/* =====================================================
   PAGE LOADING
===================================================== */

.page-loading{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;

    padding:80px 20px;
    text-align:center;

    font-family:"Roboto Mono",monospace;
    font-size:12px;
    font-weight:900;
    letter-spacing:.5px;

    animation:pageReveal .6s var(--ease-out);
}


.page-loading .spin{
    display:inline-block;
    width:26px;
    height:26px;

    border:4px solid var(--soft);
    border-top-color:var(--black);
    border-radius:50%;

    animation:spinRotate .8s linear infinite;

    vertical-align:middle;
    margin-right:12px;
}


/* =====================================================
   SCROLL REVEAL BASE
===================================================== */

.reveal{
    opacity:0;
    transform:translateY(36px);
    filter:blur(4px);
    transition:opacity .9s var(--ease-out),
               transform .9s var(--ease-out),
               filter .9s var(--ease-out);
    will-change:opacity,transform;
}


.reveal.is-visible{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
}


/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{
    margin-top:40px;
    padding:35px;

    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);

    box-shadow:var(--shadow);

    transition:box-shadow .5s var(--ease-out);
}


.profile-card:hover{
    box-shadow:8px 9px 0 var(--black);
}


.profile-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}


.profile-heading h3{
    font-family:"Archivo Black",sans-serif;
    font-size:34px;
    word-break:break-word;
}


.verified{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:8px 11px;

    background:#e9f8e8;
    border:2px solid var(--black);
    border-radius:999px;

    font-family:"Roboto Mono",monospace;
    font-size:9px;
    font-weight:900;
}


.verified::before{
    content:"✓";
    width:16px;
    height:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--blue);
    color:white;
}


.profile-text{
    margin-top:22px;
    color:var(--body);
    font-size:15px;
    line-height:1.85;
    white-space:pre-wrap;
    word-break:break-word;
}


.profile-text + .profile-text{
    margin-top:14px;
}


/* =====================================================
   MESSAGE CARD
===================================================== */

.message-card{
    position:relative;

    margin-top:40px;
    padding:40px;

    background:var(--black);
    color:var(--surface);

    border:var(--border);
    border-radius:var(--radius);

    box-shadow:var(--shadow);
    overflow:hidden;

    transition:transform .5s var(--ease-out);
}


.message-card::before{
    content:"“";
    position:absolute;
    right:25px;
    top:-35px;
    color:#302b20;
    font-family:Georgia,serif;
    font-size:220px;
    line-height:1;
    opacity:0;
    animation:fadeSlideRight 1.2s var(--ease-out) .5s forwards;
}


.message-card > *{
    position:relative;
    z-index:2;
}


.message-label{
    color:var(--yellow);
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
}


.message-card h3{
    margin-top:17px;
    max-width:800px;
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(31px,5vw,54px);
    line-height:1;
    word-break:break-word;
}


.message-card blockquote{
    margin-top:24px;
    max-width:850px;
    color:#e5ddce;
    font-size:17px;
    line-height:1.85;
    white-space:pre-wrap;
    word-break:break-word;
}


.signature{
    margin-top:27px;
    padding-top:18px;
    border-top:1px solid #655e50;
}


.signature-name{
    font-family:"Caveat",cursive;
    color:var(--yellow);
    font-size:38px;
}


.signature-role{
    margin-top:3px;
    color:#cfc6b4;
    font-family:"Roboto Mono",monospace;
    font-size:9px;
    font-weight:900;
}


/* =====================================================
   ABOUT
===================================================== */

.about-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:22px;
    margin-top:40px;
}


.about-card{
    padding:30px;
    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-soft);

    transition:transform .4s var(--ease-out), box-shadow .4s var(--ease-out);
}


.about-card:hover{
    transform:translate(-2px,-3px);
    box-shadow:6px 8px 0 var(--black);
}


.about-card h3{
    font-family:"Archivo Black",sans-serif;
    font-size:30px;
}


.about-card p{
    margin-top:15px;
    color:var(--body);
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
}


.fact-list{
    margin-top:20px;
    display:grid;
    gap:10px;
}


.fact{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px;

    background:var(--soft);
    border:1px solid rgba(29,26,20,.25);
    border-radius:8px;

    flex-wrap:wrap;

    transition:transform .3s var(--ease-out), background .3s ease;
}


.fact:hover{
    transform:translateX(4px);
    background:#f0e6c9;
}


.fact span{
    color:#6b6254;
    font-family:"Roboto Mono",monospace;
    font-size:8px;
    font-weight:900;
}


.fact strong{
    font-size:12px;
    text-align:right;
    word-break:break-word;
}


/* =====================================================
   TALKS
===================================================== */

.talks-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
    margin-top:40px;
}


.talk-card{
    position:relative;
    padding:30px;

    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);

    box-shadow:var(--shadow-soft);

    transition:transform .4s var(--ease-out), box-shadow .4s var(--ease-out);
    overflow:hidden;
}


.talk-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:6px;
    height:100%;
    background:var(--yellow);

    transform:scaleY(0);
    transform-origin:top center;
    transition:transform .6s var(--ease-spring);
}


.talk-card:hover::before{
    transform:scaleY(1);
}


.talk-card:hover{
    transform:translateY(-6px);
    box-shadow:6px 8px 0 var(--black);
}


.talk-number{
    display:inline-block;
    padding:6px 10px;
    background:var(--yellow);
    border:2px solid var(--black);
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:8px;
    font-weight:900;
}


.talk-date{
    margin-top:14px;

function escapeHTML(str){
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
    }[tag] || tag));
}


function normalizeRole(role){
    const r = String(role || '').toLowerCase().trim().replaceAll('_','-');
    if (r === 'superadmin') return 'super-admin';
    return r;
}


function getInitials(name){
    if (!name) return 'U';
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return 'U';
    if (parts.length === 1) return parts[0].substring(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}


function toDate(value){
    try{
        if (!value) return null;
        if (typeof value.toDate === 'function') return value.toDate();
        if (value instanceof Date) return value;
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? null : d;
    } catch(_) {
        return null;
    }
}


function formatLongDate(value){
    const d = toDate(value);
    if (!d) return '—';
    return d.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
    }).toUpperCase();
}


/* =====================================================

===================================================== */

function initRevealObserver(){
    if (revealObserver) revealObserver.disconnect();

    revealObserver = new IntersectionObserver(
        entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting){
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        },
        {
            threshold:.12,
            rootMargin:'0px 0px -40px 0px'
        }
    );
}


function attachReveal(){
    const items = document.querySelectorAll(
        ".profile-card, .message-card, .about-card, .talk-card, .vision-card, .responsibility-box, .statement, .verify-box, .board-state-card, .section .label, .section .section-title, .section .section-description"
    );

    items.forEach((el, i) => {
        el.classList.add('reveal');

        // Slight stagger — 80ms apart within viewport
        el.style.transitionDelay = (Math.min(i, 6) * 70) + 'ms';

        revealObserver.observe(el);
    });
}

/* =====================================================
   FETCH / SUBSCRIBE
===================================================== */

function processUsers(users){
    chairman = users.find(u => normalizeRole(u.role) === 'chairman') || null;
}


async function fetchChairmanOnce(){
    try{
        const snap = await db.collection('users').get();
        const users = [];
        snap.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
        processUsers(users);
        renderChairmanPage(chairman);
    } catch(err){
        console.error('Chairman fetch error:', err);
        renderChairmanPage(null);
    }
}


function subscribeChairman(){
    if (chairmanUnsubscribe) chairmanUnsubscribe();

    chairmanUnsubscribe = db.collection('users').onSnapshot(
        snap => {
            const users = [];
            snap.forEach(doc => users.push({ id: doc.id, ...doc.data() }));

            const prevChairmanId = chairman ? chairman.id : null;
            processUsers(users);

            // On first render, always render. Afterwards, only re-render
            // if the chairman identity actually changed — avoids flicker.
            const newChairmanId = chairman ? chairman.id : null;

            if (firstRender || prevChairmanId !== newChairmanId){
                firstRender = false;
                renderChairmanPage(chairman);
            }
        },
        err => {
            console.error('Chairman subscription error:', err);
            fetchChairmanOnce();
        }
    );
}

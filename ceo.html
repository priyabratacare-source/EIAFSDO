<style>

/* =====================================================
   ROOT
===================================================== */

:root{
    --bg:#fffaf0;
    --surface:#fffef8;
    --soft:#f6eed8;
    --text:#1d1a14;
    --body:#3d3830;

    --yellow:#f2c94c;
    --gold:#a87c00;
    --gold-light:#ffe68a;
    --green:#e8ddb4;
    --blue:#1687ff;
    --board-blue:#3d64b8;
    --board-blue-light:#c7d9ff;

    --black:#17150f;
    --white:#ffffff;

    --border:2px solid var(--black);
    --shadow:6px 7px 0 var(--black);
    --shadow-small:3px 4px 0 var(--black);
    --radius:12px;

    --ease-out:cubic-bezier(.22,.75,.2,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}

body{
    font-family:"Nunito Sans",sans-serif;
    background:var(--bg);
    color:var(--body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
}

/* =====================================================
   BACKGROUND
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    z-index:-5;
    pointer-events:none;
    background:
        radial-gradient(circle at 10% 10%, rgba(242,201,76,.24), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(232,221,180,.38), transparent 27%),
        radial-gradient(circle at 50% 100%, rgba(242,201,76,.15), transparent 32%);
    filter:blur(22px);
    animation:bgBreath 9s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;
    opacity:.22;
    background-image:
        linear-gradient(rgba(29,26,20,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29,26,20,.08) 1px, transparent 1px);
    background-size:48px 48px;
    animation:gridMove 20s linear infinite;
}

@keyframes bgBreath{
    from{ transform:scale(1); }
    to{ transform:scale(1.08); }
}

@keyframes gridMove{
    from{ background-position:0 0; }
    to{ background-position:48px 48px; }
}

/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes pageReveal{
    from{ opacity:0; transform:translateY(18px); filter:blur(5px); }
    to{ opacity:1; transform:translateY(0); filter:blur(0); }
}

@keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(28px); }
    to{ opacity:1; transform:translateY(0); }
}

@keyframes fadeSlideLeft{
    from{ opacity:0; transform:translateX(-28px); }
    to{ opacity:1; transform:translateX(0); }
}

@keyframes fadeSlideRight{
    from{ opacity:0; transform:translateX(28px); }
    to{ opacity:1; transform:translateX(0); }
}

@keyframes fadeScaleIn{
    from{ opacity:0; transform:scale(.92) rotate(-4deg); }
    to{ opacity:1; transform:scale(1) rotate(-1deg); }
}

@keyframes softPulse{
    0%,100%{ transform:scale(1); box-shadow:3px 4px 0 var(--black); }
    50%{ transform:scale(1.04); box-shadow:5px 6px 0 var(--black); }
}

@keyframes pulse{
    50%{ transform:scale(.65); opacity:.5; }
}

@keyframes spinRotate{
    to{ transform:rotate(360deg); }
}

@keyframes underlineGrow{
    to{ transform:skew(-8deg) scaleX(1); }
}

@keyframes premiumShine{
    0%{ left:-120%; }
    35%,100%{ left:150%; }
}

@keyframes vacantFloat{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-10px) rotate(3deg); }
}

@keyframes vacantPulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.08); opacity:.7; }
}

/* =====================================================
   NAVIGATION
===================================================== */

.nav{
    position:sticky;
    top:12px;
    z-index:1000;
    width:min(1180px, calc(100% - 28px));
    margin:12px auto 0;
    min-height:66px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:9px 13px;
    background:rgba(255,254,248,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:var(--border);
    border-radius:999px;
    box-shadow:var(--shadow-small);
    animation:fadeSlideUp .8s var(--ease-out) both;
    transition:box-shadow .4s var(--ease-out);
}

.nav:hover{ box-shadow:5px 7px 0 var(--black); }

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text);
    text-decoration:none;
    min-width:0;
}

.brand-logo{
    width:44px;
    height:44px;
    flex:none;
    border-radius:50%;
    border:2px solid var(--black);
    object-fit:cover;
    background:var(--yellow);
    transition:transform .5s var(--ease-spring);
}

.brand:hover .brand-logo{
    transform:rotate(-8deg) scale(1.08);
}

.brand-text{
    font-family:"Archivo Black",sans-serif;
    font-size:15px;
    white-space:nowrap;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.nav-links a{
    color:var(--text);
    text-decoration:none;
    padding:9px 12px;
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:11px;
    font-weight:800;
    transition:background .25s var(--ease-out), transform .25s var(--ease-out);
}

.nav-links a:hover{
    background:var(--yellow);
    transform:translateY(-2px);
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:min(1120px, calc(100% - 30px));
    margin:auto;
}

.section{
    padding:95px 0 15px;
}

.label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 12px;
    background:var(--yellow);
    border:var(--border);
    border-radius:999px;
    box-shadow:var(--shadow-small);
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
}

.label::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--black);
    animation:pulse 2.4s ease-in-out infinite;
}

.section-title{
    margin-top:21px;
    max-width:900px;
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(38px,6vw,72px);
    line-height:.98;
    letter-spacing:-2px;
    color:var(--text);
}

.section-description{
    max-width:790px;
    margin-top:18px;
    color:var(--body);
    font-size:17px;
    line-height:1.75;
}

/* =====================================================
   PAGE LOADING
===================================================== */

.page-loading{
    min-height:60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:80px 20px;
    text-align:center;
    font-family:"Roboto Mono",monospace;
    font-size:12px;
    font-weight:900;
    letter-spacing:.5px;
    animation:pageReveal .6s var(--ease-out);
}

.page-loading .spin{
    display:inline-block;
    width:26px;
    height:26px;
    border:4px solid var(--soft);
    border-top-color:var(--black);
    border-radius:50%;
    animation:spinRotate .8s linear infinite;
    vertical-align:middle;
    margin-right:12px;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:680px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:110px 0 70px;
}

.hero-inner{
    width:100%;
    display:grid;
    grid-template-columns:.95fr 1.05fr;
    gap:60px;
    align-items:center;
}

/* =====================================================
   CEO VISUAL
===================================================== */

.ceo-visual{
    position:relative;
    display:flex;
    justify-content:center;
    animation:fadeScaleIn 1.2s var(--ease-spring) both;
    animation-delay:.15s;
}

.ceo-frame{
    position:relative;
    width:min(420px, 100%);
    aspect-ratio:1/1;
    background:linear-gradient(135deg, #ffe9a8, #f2c94c);
    border:var(--border);
    border-radius:22px;
    box-shadow:10px 12px 0 var(--black);
    padding:15px;
    transform:rotate(-2deg);
    transition:transform .8s var(--ease-spring), box-shadow .8s var(--ease-spring);
}

.ceo-frame:hover{
    transform:rotate(0deg) scale(1.02);
    box-shadow:14px 16px 0 var(--black);
}

.ceo-frame::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-40px;
    top:-40px;
    border-radius:50%;
    background:var(--yellow);
    border:var(--border);
    z-index:-1;
    animation:softPulse 4s ease-in-out infinite;
}

.ceo-frame::after{
    content:"CEO";
    position:absolute;
    left:-35px;
    bottom:35px;
    padding:10px 14px;
    background:var(--black);
    color:var(--yellow);
    border:2px solid var(--yellow);
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
    transform:rotate(-5deg);
    opacity:0;
    animation:fadeSlideUp .8s var(--ease-out) .9s forwards;
}

.ceo-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    border:2px solid var(--black);
    border-radius:13px;
    background:var(--soft);
    animation:pageReveal 1.4s var(--ease-out) both;
    animation-delay:.4s;
}

.ceo-initials-fallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, #fff0a4, #d1a235, #8a6500);
    color:#17150f;
    border:2px solid var(--black);
    border-radius:13px;
    font-family:"Archivo Black",sans-serif;
    font-size:120px;
    letter-spacing:-4px;
    line-height:1;
}

.image-orbit{
    position:absolute;
    width:25px;
    height:25px;
    border-radius:50%;
    background:var(--blue);
    border:2px solid var(--black);
    top:35px;
    left:20px;
    animation:fadeSlideUp .6s var(--ease-out) .9s forwards, floatDot 3s ease-in-out 1.5s infinite;
    opacity:0;
}

.image-orbit.two{
    width:17px;
    height:17px;
    background:#35a853;
    top:auto;
    left:auto;
    right:30px;
    bottom:30px;
    animation:fadeSlideUp .6s var(--ease-out) 1.1s forwards, floatDot 3s ease-in-out 1.7s infinite;
    opacity:0;
}

@keyframes floatDot{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-13px); }
}

/* ─── Vacant visual ─── */
.ceo-visual.vacant .ceo-frame{
    background:linear-gradient(135deg, #c7d9ff, #6b8fdb);
    border-color:#0f172a;
    box-shadow:10px 12px 0 #0f172a;
}

.ceo-visual.vacant .ceo-frame::before{
    background:var(--board-blue-light);
    border-color:#0f172a;
}

.ceo-visual.vacant .ceo-frame::after{
    content:"VACANT";
    background:#0f172a;
    color:var(--board-blue-light);
    border-color:var(--board-blue-light);
}

.ceo-visual.vacant .ceo-initials-fallback{
    background:linear-gradient(135deg, #e6eeff, #c7d9ff, #3d64b8);
    color:#0f172a;
    animation:vacantFloat 3.5s ease-in-out infinite;
}

/* =====================================================
   HERO CONTENT
===================================================== */

.hero-content{
    text-align:left;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 14px;
    background:var(--green);
    border:var(--border);
    border-radius:999px;
    box-shadow:var(--shadow-small);
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
    opacity:0;
    animation:fadeSlideRight .8s var(--ease-out) .3s forwards;
}

.status.state-active{
    background:#fffbe9;
    border-color:#b88600;
}

.status.state-board{
    background:var(--board-blue-light);
    border-color:var(--board-blue);
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#35a853;
    border:1px solid var(--black);
    animation:pulse 1.6s ease-in-out infinite;
}

.status.state-board .status-dot{
    background:var(--board-blue);
}

.hero h1{
    margin-top:25px;
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(48px,7vw,92px);
    line-height:.9;
    letter-spacing:-4px;
    color:var(--text);
}

.hero h1 span{
    display:block;
    position:relative;
    width:max-content;
}

.hero h1 span::after{
    content:"";
    position:absolute;
    left:2%;
    right:-4%;
    bottom:2px;
    height:14px;
    background:var(--yellow);
    z-index:-1;
    transform:skew(-8deg) scaleX(0);
    transform-origin:left center;
    animation:underlineGrow 1s var(--ease-spring) .9s forwards;
}

.hero-sub{
    max-width:650px;
    margin-top:25px;
    color:var(--body);
    font-size:17px;
    line-height:1.75;
    opacity:0;
    animation:fadeSlideUp .9s var(--ease-out) .7s forwards;
}

.role-pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:24px;
}

.role-pill{
    padding:8px 11px;
    background:var(--surface);
    border:2px solid var(--black);
    border-radius:999px;
    box-shadow:2px 3px 0 var(--black);
    font-family:"Roboto Mono",monospace;
    font-size:9px;
    font-weight:900;
    opacity:0;
    animation:fadeSlideUp .7s var(--ease-out) .9s forwards;
}

.role-pill:nth-child(2){ animation-delay:1s; }
.role-pill:nth-child(3){ animation-delay:1.1s; }
.role-pill:nth-child(4){ animation-delay:1.2s; }

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:28px;
    opacity:0;
    animation:fadeSlideUp .9s var(--ease-out) 1.2s forwards;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:12px 19px;
    border:var(--border);
    border-radius:9px;
    box-shadow:var(--shadow-small);
    text-decoration:none;
    color:var(--text);
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
    transition:transform .35s var(--ease-spring), box-shadow .35s var(--ease-out), background .3s ease;
    cursor:pointer;
}

.btn:hover{
    transform:translate(-2px,-2px);
    box-shadow:6px 7px 0 var(--black);
}

.btn:active{
    transform:translate(1px,2px);
    box-shadow:1px 1px 0 var(--black);
}

.btn-yellow{ background:var(--yellow); }
.btn-white{ background:var(--surface); }
.btn-board{ background:var(--board-blue-light); border-color:var(--board-blue); }

/* =====================================================
   SCROLL REVEAL
===================================================== */

.reveal{
    opacity:0;
    transform:translateY(36px);
    filter:blur(4px);
    transition:
        opacity .9s var(--ease-out),
        transform .9s var(--ease-out),
        filter .9s var(--ease-out);
    will-change:opacity,transform;
}

.reveal.is-visible{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
}

/* =====================================================
   VACANT STATE PANEL
===================================================== */

.vacant-panel{
    margin-top:40px;
    padding:55px 35px;
    background:linear-gradient(135deg, #1a2436 0%, #2b3a55 48%, #0f172a 100%);
    color:#e6eeff;
    border:2px solid var(--board-blue);
    border-radius:18px;
    box-shadow:
        0 0 0 2px var(--black),
        9px 11px 0 var(--black);
    text-align:center;
    position:relative;
    overflow:hidden;
}

.vacant-panel::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    right:-80px;
    top:-90px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(107,143,219,.4), transparent 67%);
}

.vacant-panel::after{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:55%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
    transform:skewX(-18deg);
    animation:premiumShine 6.5s ease-in-out infinite;
}

.vacant-panel > *{
    position:relative;
    z-index:2;
}

.vacant-icon{
    font-size:78px;
    line-height:1;
    margin-bottom:18px;
    display:block;
    animation:vacantFloat 3.5s ease-in-out infinite;
}

.vacant-panel h3{
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(26px,4vw,42px);
    color:#e6eeff;
    margin-bottom:14px;
    letter-spacing:-1px;
}

.vacant-panel p{
    max-width:620px;
    margin:0 auto 12px;
    color:#c4d3f2;
    font-size:15px;
    line-height:1.75;
}

.vacant-panel p strong{
    color:#ffd968;
}

.vacant-status-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:24px;
}

.vacant-chip{
    padding:8px 14px;
    background:var(--board-blue-light);
    color:#0f172a;
    border:2px solid var(--board-blue-light);
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:10px;
    font-weight:900;
    letter-spacing:.5px;
    text-transform:uppercase;
}

.vacant-chip.alt{
    background:transparent;
    color:var(--board-blue-light);
    border-color:var(--board-blue-light);
}

/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{
    margin-top:40px;
    padding:35px;
    background:var(--surface);
    border:var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    transition:box-shadow .5s var(--ease-out);
}

.profile-card:hover{
    box-shadow:8px 9px 0 var(--black);
}

.profile-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.profile-heading h3{
    font-family:"Archivo Black",sans-serif;
    font-size:34px;
    word-break:break-word;
    color:var(--text);
}

.verified{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 11px;
    background:#e9f8e8;
    border:2px solid var(--black);
    border-radius:999px;
    font-family:"Roboto Mono",monospace;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
}

.verified::before{
    content:"✓";
    width:16px;
    height:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--blue);
    color:white;
}

.profile-text{
    margin-top:22px;
    color:var(--body);
    font-size:15px;
    line-height:1.85;
    white-space:pre-wrap;
    word-break:break-word;
}

.profile-text + .profile-text{
    margin-top:14px;
}

.fact-list{
    margin-top:24px;
    display:grid;
    gap:10px;
}

.fact{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px;
    background:var(--soft);

function escapeHTML(str){
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({
        '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
    }[tag] || tag));
}


function normalizeRole(role){
    const r = String(role || '').toLowerCase().trim().replaceAll('_','-');

    return r;
}


function getInitials(name){
    if (!name) return 'CEO';
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return 'CEO';
    if (parts.length === 1) return parts[0].substring(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}


function toDate(value){
    try{
        if (!value) return null;
        if (typeof value.toDate === 'function') return value.toDate();
        if (value instanceof Date) return value;
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? null : d;
    } catch(_) { return null; }
}


function formatLongDate(value){
    const d = toDate(value);
    if (!d) return null;
    return d.toLocaleDateString('en-IN', {

    }).toUpperCase();
}

function initRevealObserver(){
    if (revealObserver) revealObserver.disconnect();

    revealObserver = new IntersectionObserver(
        entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting){
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        },
        {
            threshold:.12,
            rootMargin:'0px 0px -40px 0px'
        }
    );
}


function attachReveal(){
    const items = document.querySelectorAll(
        ".profile-card, .message-card, .leadership-card, .responsibility-box, .responsibility, .statement, .verify-box, .vacant-panel, .section .label, .section .section-title, .section .section-description"

    items.forEach((el, i) => {
        el.classList.add('reveal');
        el.style.transitionDelay = (Math.min(i, 6) * 70) + 'ms';

    });

/* =====================================================
   PROCESS USERS
===================================================== */

function processUsers(users){
    // CEO — first user with role 'ceo'
    ceoUser = users.find(u => normalizeRole(u.role) === 'ceo') || null;
}


/* =====================================================
   FETCH / SUBSCRIBE
===================================================== */

async function fetchCeoOnce(){
    try{
        const snap = await db.collection('users').get();
        const users = [];
        snap.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
        processUsers(users);

        if (ceoUser) renderCeoPage(ceoUser);
        else renderCeoVacantPage();
    } catch(err){
        console.error('CEO fetch error:', err);
        processUsers([]);
        renderCeoVacantPage();
    }
}


function subscribeCeo(){
    if (ceoUnsubscribe) ceoUnsubscribe();

    ceoUnsubscribe = db.collection('users').onSnapshot(
        snap => {
            const users = [];
            snap.forEach(doc => users.push({ id: doc.id, ...doc.data() }));

            const prevCeoId = ceoUser ? ceoUser.id : null;
            processUsers(users);
            const newCeoId = ceoUser ? ceoUser.id : null;

            // Re-render only when CEO identity changes or first render
            if (firstRender || prevCeoId !== newCeoId || !hasRendered){
                firstRender = false;
                hasRendered = true;

                if (ceoUser) renderCeoPage(ceoUser);
                else renderCeoVacantPage();
            }
        },
        err => {
            console.error('CEO subscription error:', err);
            fetchCeoOnce();
        }
    );
}
